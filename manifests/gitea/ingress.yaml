apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gitea-release-http
      port:
        name: http
  tls:
    - hosts:
        - gitea
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-direct
spec:
  rules:
    - host: git.k3s.thehellings.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-release-http
                port:
                  name: http
